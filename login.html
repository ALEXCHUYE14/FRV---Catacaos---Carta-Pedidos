<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRV Catacaos — Acceso Administrador</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Exo 2', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .bg-animation::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle, rgba(245, 200, 0, 0.03) 0%, transparent 50%);
      animation: rotate 30s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .floating-orbs {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.3;
      animation: float 8s ease-in-out infinite;
    }

    .orb:nth-child(1) {
      width: 300px;
      height: 300px;
      background: var(--yellow, #F5C800);
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .orb:nth-child(2) {
      width: 200px;
      height: 200px;
      background: var(--magenta, #D4006A);
      top: 60%;
      right: 15%;
      animation-delay: 2s;
    }

    .orb:nth-child(3) {
      width: 250px;
      height: 250px;
      background: var(--teal, #00848A);
      bottom: 10%;
      left: 30%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.1); }
    }

    /* Login container */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Logo section */
    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-waves {
      display: flex;
      justify-content: center;
      gap: 4px;
      height: 40px;
      margin-bottom: 16px;
    }

    .logo-wave-bar {
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, #F5C800 0%, #FFD93D 100%);
      border-radius: 2px;
      animation: wave 1.2s ease-in-out infinite;
    }

    .logo-wave-bar:nth-child(1) { animation-delay: 0s; }
    .logo-wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .logo-wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .logo-wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .logo-wave-bar:nth-child(5) { animation-delay: 0.4s; }
    .logo-wave-bar:nth-child(6) { animation-delay: 0.5s; }
    .logo-wave-bar:nth-child(7) { animation-delay: 0.6s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1); }
    }

    .logo-text {
      font-size: 36px;
      font-weight: 900;
      color: white;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }

    .logo-text span {
      color: #F5C800;
    }

    .logo-subtitle {
      font-size: 11px;
      color: #888;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Form styles */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-family: 'Exo 2', sans-serif;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #F5C800;
      background: rgba(245, 200, 0, 0.05);
      box-shadow: 0 0 20px rgba(245, 200, 0, 0.1);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 38px;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.2s;
    }

    .password-toggle:hover {
      color: #F5C800;
    }

    /* Login button */
    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #F5C800 0%, #FFD93D 100%);
      border: none;
      border-radius: 12px;
      color: #0a0a0a;
      font-family: 'Exo 2', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(245, 200, 0, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Error message */
    .error-message {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px;
      color: #ff4444;
      font-size: 13px;
      text-align: center;
      display: none;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    /* Footer */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }

    .login-footer a {
      color: #F5C800;
      text-decoration: none;
      transition: color 0.2s;
    }

    .login-footer a:hover {
      color: #FFD93D;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(10, 10, 10, 0.3);
      border-radius: 50%;
      border-top-color: #0a0a0a;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 30px 24px;
      }

      .logo-text {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-animation">
    <div class="floating-orbs">
      <div class="orb"></div>
      <div class="orb"></div>
      <div class="orb"></div>
    </div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-waves">
          <div class="logo-wave-bar"></div>
          <div class="logo-wave-bar"></div>
          <div class="logo-wave-bar"></div>
          <div class="logo-wave-bar"></div>
          <div class="logo-wave-bar"></div>
          <div class="logo-wave-bar"></div>
          <div class="logo-wave-bar"></div>
        </div>
        <div class="logo-text">F<span>R</span>V</div>
        <div class="logo-subtitle">Catacaos — Panel de Administración</div>
      </div>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Ingrese su usuario"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required
          >
          <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
        </div>

        <div class="error-message" id="errorMessage">
          Usuario o contraseña incorrectos
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          Iniciar Sesión
        </button>
      </form>

      <div class="login-footer">
        <p>Acceso exclusivo para administradores</p>
        <p style="margin-top: 8px;">© 2026 FRV Catacaos. Todos los derechos reservados.</p>
      </div>
    </div>
  </div>

  <script>
    // Credenciales de administrador
    const ADMIN_CREDENTIALS = {
      username: 'admin',
      password: 'frv2026'
    };

    // Verificar si ya está autenticado
    if (localStorage.getItem('frv_admin_auth') === 'true') {
      window.location.href = 'panel-bar.html';
    }

    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.password-toggle');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁️';
      }
    }

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorMessage = document.getElementById('errorMessage');
      
      // Hide previous error
      errorMessage.style.display = 'none';
      
      // Show loading state
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span>Verificando...';
      
      // Simulate API call delay
      setTimeout(() => {
        if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
          // Success - store auth and redirect
          localStorage.setItem('frv_admin_auth', 'true');
          localStorage.setItem('frv_admin_user', username);
          localStorage.setItem('frv_login_time', new Date().toISOString());
          
          // Add success animation
          loginBtn.innerHTML = '✓ Acceso Concedido';
          loginBtn.style.background = 'linear-gradient(135deg, #00ff88 0%, #00cc66 100%)';
          
          setTimeout(() => {
            window.location.href = 'panel-bar.html';
          }, 500);
        } else {
          // Error
          errorMessage.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.innerHTML = 'Iniciar Sesión';
          
          // Shake animation
          errorMessage.style.animation = 'none';
          setTimeout(() => {
            errorMessage.style.animation = 'shake 0.5s ease';
          }, 10);
        }
      }, 1000);
    });

    // Enter key support
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
