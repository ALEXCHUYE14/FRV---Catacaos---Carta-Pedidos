<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://www.gstatic.com https://cdnjs.cloudflare.com https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com; frame-ancestors 'none';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<title>FRV Catacaos — Mi Pedido</title>
<meta property="og:url" content="https://frv-api.netlify.app/anfitriona.html">
<meta name="description" content="Consulta el estado de tu pedido en FRV Catacaos">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;800;900&family=DM+Mono:wght@400;500&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Exo 2', sans-serif;
  background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f1a 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 400px;
}

.logo {
  text-align: center;
  margin-bottom: 30px;
}

.logo-brand {
  font-size: 48px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 4px;
}

.logo-brand span {
  color: #00ff88;
}

.logo-sub {
  font-size: 14px;
  color: #666;
  letter-spacing: 6px;
  text-transform: uppercase;
}

.card {
  background: rgba(30, 30, 30, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 30px;
  backdrop-filter: blur(10px);
}

.mesa-input-section {
  text-align: center;
}

.mesa-label {
  color: #888;
  font-size: 14px;
  margin-bottom: 15px;
  display: block;
}

.mesa-input-wrapper {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.mesa-input {
  width: 120px;
  padding: 15px 20px;
  font-size: 32px;
  font-weight: 800;
  text-align: center;
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  outline: none;
  transition: all 0.3s;
}

.mesa-input:focus {
  border-color: #00ff88;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
}

.mesa-input::placeholder {
  color: #444;
}

.buscar-btn {
  padding: 15px 30px;
  background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
  border: none;
  border-radius: 12px;
  color: #0a0a0a;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Exo 2', sans-serif;
  transition: all 0.3s;
}

.buscar-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
}

.resultado-card {
  display: none;
  text-align: center;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.resultado-card.show {
  display: block;
}

.mesa-num-grande {
  font-size: 72px;
  font-weight: 900;
  color: #fff;
  line-height: 1;
  margin-bottom: 5px;
}

.mesa-etiqueta {
  font-size: 14px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 4px;
  margin-bottom: 30px;
}

.estado-badge {
  display: inline-block;
  padding: 12px 30px;
  border-radius: 50px;
  font-size: 18px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 25px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

.estado-badge.pending {
  background: rgba(255, 200, 0, 0.2);
  color: #ffc800;
  border: 2px solid rgba(255, 200, 0, 0.5);
}

.estado-badge.preparing {
  background: rgba(255, 107, 107, 0.2);
  color: #ff6b6b;
  border: 2px solid rgba(255, 107, 107, 0.5);
}

.estado-badge.ready {
  background: rgba(0, 255, 136, 0.2);
  color: #00ff88;
  border: 2px solid rgba(0, 255, 136, 0.5);
  box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
}

.estado-badge.completed {
  background: rgba(136, 136, 136, 0.2);
  color: #888;
  border: 2px solid rgba(136, 136, 136, 0.5);
}

.pedido-detalle {
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
  padding: 20px;
  text-align: left;
  margin-bottom: 20px;
}

.pedido-titulo {
  color: #666;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 15px;
}

.pedido-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  color: #fff;
  font-size: 15px;
}

.pedido-item:last-child {
  border-bottom: none;
}

.item-qty {
  color: #00ff88;
  font-weight: 700;
  margin-right: 10px;
}

.item-name {
  flex: 1;
}

.item-price {
  color: #888;
  font-size: 14px;
}

.total-pedido {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: rgba(0, 255, 136, 0.1);
  border-radius: 10px;
  margin-top: 15px;
}

.total-label {
  color: #00ff88;
  font-weight: 600;
  font-size: 14px;
}

.total-value {
  color: #00ff88;
  font-size: 24px;
  font-weight: 800;
}

.pago-info {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  margin-top: 15px;
  font-size: 14px;
}

.pago-label {
  color: #888;
  font-weight: 600;
}

.pago-metodo {
  color: #ffc800;
  font-weight: 700;
}

.pago-info.efectivo .pago-metodo {
  color: #00ff88;
}

.pago-info.tarjeta .pago-metodo {
  color: #ff6b6b;
}

.pago-info.yape .pago-metodo {
  color: #00ccff;
}

.pago-info.transferencia .pago-metodo {
  color: #9b59b6;
}

.cambio-btn {
  width: 100%;
  padding: 15px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  color: #888;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Exo 2', sans-serif;
  margin-top: 15px;
  transition: all 0.3s;
}

.cambio-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

.sin-pedido {
  text-align: center;
  padding: 40px 20px;
}

.sin-pedido-icon {
  font-size: 64px;
  margin-bottom: 20px;
}

.sin-pedido-texto {
  color: #666;
  font-size: 16px;
}

.estado-texto {
  margin-bottom: 10px;
}

.connection-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 30px;
  font-size: 12px;
  color: #444;
}

.connection-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #666;
}

.connection-dot.connected {
  background: #00ff88;
  box-shadow: 0 0 10px #00ff88;
}

.hora-actual {
  position: fixed;
  top: 20px;
  right: 20px;
  color: #444;
  font-size: 14px;
  font-family: 'DM Mono', monospace;
}

@media (max-width: 480px) {
  .card {
    padding: 20px;
  }
  
  .mesa-num-grande {
    font-size: 56px;
  }
  
  .buscar-btn {
    padding: 15px 20px;
    font-size: 14px;
  }
}
</style>
</head>
<body>

<div class="hora-actual" id="clock">--:--</div>

<div class="container">
  <div class="logo">
    <div class="logo-brand">F<span>R</span>V</div>
    <div class="logo-sub">Catacaos</div>
  </div>

  <div class="card" id="inputSection">
    <div class="mesa-input-section">
      <label class="mesa-label">Ingresa el número de tu mesa</label>
      <div class="mesa-input-wrapper">
        <input type="number" class="mesa-input" id="mesaInput" placeholder="?" min="1" max="50">
        <button class="buscar-btn" onclick="buscarPedido()">Buscar</button>
      </div>
    </div>
  </div>

  <div class="card resultado-card" id="resultadoCard">
    <div class="mesa-num-grande" id="mesaNumDisplay">--</div>
    <div class="mesa-etiqueta">Mesa</div>
    
    <div class="estado-badge pending" id="estadoBadge">CARGANDO...</div>
    <div class="estado-texto" id="estadoTexto"></div>
    
    <div id="pedidoDetalle"></div>
    
    <button class="cambio-btn" onclick="cambiarMesa()">🔄 Consultar otra mesa</button>
  </div>
  
  <div class="connection-indicator">
    <div class="connection-dot" id="connectionDot"></div>
    <span id="connectionText">Conectando...</span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7AniUOlaEngq9rFJBNudZVdAzxMqxOOg",
  authDomain: "frv-catacaos.firebaseapp.com",
  projectId: "frv-catacaos",
  storageBucket: "frv-catacaos.firebasestorage.app",
  messagingSenderId: "337954350829",
  appId: "1:337954350829:web:332af101a28a34e",
  databaseURL: "https://frv-catacaos-default-rtdb.firebaseio.com"
};

let db = null;
let mesaActual = null;
let unsubscribe = null;
let ordersCache = [];

function initFirebase() {
  if (db) return db;
  
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    updateConnectionStatus(true);
    return db;
  } catch (e) {
    console.error('Firebase init error:', e);
    updateConnectionStatus(false);
    return null;
  }
}

function updateConnectionStatus(connected) {
  const dot = document.getElementById('connectionDot');
  const text = document.getElementById('connectionText');
  
  if (connected) {
    dot.classList.add('connected');
    text.textContent = 'En vivo';
  } else {
    dot.classList.remove('connected');
    text.textContent = 'Sin conexión';
  }
}

function updateClock() {
  const now = new Date();
  const hours = now.getHours().toString().padStart(2, '0');
  const minutes = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('clock').textContent = `${hours}:${minutes}`;
}

setInterval(updateClock, 1000);
updateClock();

function buscarPedido() {
  const mesaInput = document.getElementById('mesaInput');
  const mesa = parseInt(mesaInput.value);
  
  if (!mesa || mesa < 1 || mesa > 50) {
    alert('Por favor ingresa un número de mesa válido (1-50)');
    return;
  }
  
  mesaActual = mesa;
  document.getElementById('mesaNumDisplay').textContent = mesa;
  document.getElementById('inputSection').style.display = 'none';
  document.getElementById('resultadoCard').classList.add('show');
  
  subscribeToTableOrders(mesa);
}

function subscribeToTableOrders(mesa) {
  const database = initFirebase();
  if (!database) return;
  
  const ref = database.ref('orders');
  
  if (unsubscribe) {
    unsubscribe();
  }
  
  unsubscribe = ref.on('value', (snapshot) => {
    const data = snapshot.val() || {};
    const ordersList = Object.entries(data).map(([id, order]) => ({
      id: id,
      ...order
    }));
    
    ordersCache = ordersList;
    renderOrderForTable(mesa, ordersList);
  });
}

function renderOrderForTable(mesa, ordersList) {
  const estadoBadge = document.getElementById('estadoBadge');
  const pedidoDetalle = document.getElementById('pedidoDetalle');
  
  const mesaOrders = ordersList.filter(o => {
    const mesaNum = parseInt(o.mesa);
    return mesaNum === mesa && o.status !== 'completed' && o.status !== 'cancelled';
  });
  
  if (mesaOrders.length === 0) {
    pedidoDetalle.innerHTML = `
      <div class="sin-pedido">
        <div class="sin-pedido-icon">🍽️</div>
        <div class="sin-pedido-texto">No tienes pedidos activos en este momento</div>
      </div>
    `;
    estadoBadge.className = 'estado-badge pending';
    estadoBadge.textContent = 'SIN PEDIDOS';
    return;
  }
  
  const order = mesaOrders[0];
  const statusText = {
    'pending': 'PENDIENTE',
    'preparing': 'PREPARANDO',
    'ready': '¡LISTO!',
    'completed': 'COMPLETADO'
  };
  
  estadoBadge.className = `estado-badge ${order.status}`;
  estadoBadge.textContent = statusText[order.status] || order.status;
  
  if (order.status === 'ready') {
    document.getElementById('estadoTexto').textContent = '👆 Acércate a recoger tu pedido';
  } else if (order.status === 'preparing') {
    document.getElementById('estadoTexto').textContent = '⏱️ Tu pedido está siendo preparado';
  } else {
    document.getElementById('estadoTexto').textContent = '📝 Tu pedido ha sido recibido';
  }
  
  let itemsHTML = '';
  let total = 0;
  
  if (order.items && Array.isArray(order.items)) {
    order.items.forEach(item => {
      const itemTotal = (item.price || 0) * (item.qty || 1);
      total += itemTotal;
      itemsHTML += `
        <div class="pedido-item">
          <span class="item-qty">${item.qty || 1}x</span>
          <span class="item-name">${item.emoji || ''} ${item.name}</span>
          <span class="item-price">S/ ${itemTotal.toFixed(2)}</span>
        </div>
      `;
    });
  }
  
  pedidoDetalle.innerHTML = `
    <div class="pedido-detalle">
      <div class="pedido-titulo">📋 Detalle del Pedido</div>
      ${itemsHTML}
      <div class="total-pedido">
        <span class="total-label">TOTAL</span>
        <span class="total-value">S/ ${total.toFixed(2)}</span>
      </div>
      <div class="pago-info ${getPaymentClass(order.payment)}">
        <span class="pago-label">💳 Pago:</span>
        <span class="pago-metodo">${order.payment || '💵 EFECTIVO'}</span>
      </div>
    </div>
  `;
  
  function getPaymentClass(payment) {
    if (!payment) return 'efectivo';
    const p = payment.toLowerCase();
    if (p.includes('efectivo')) return 'efectivo';
    if (p.includes('tarjeta')) return 'tarjeta';
    if (p.includes('yape')) return 'yape';
    if (p.includes('transferencia')) return 'transferencia';
    return 'efectivo';
  }
  
  if (order.status === 'ready') {
    playReadySound();
  }
}

function playReadySound() {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.frequency.value = 880;
    oscillator.type = 'sine';
    gainNode.gain.value = 0.3;
    
    oscillator.start();
    setTimeout(() => {
      oscillator.stop();
    }, 200);
    
    setTimeout(() => {
      const osc2 = audioContext.createOscillator();
      const gain2 = audioContext.createGain();
      osc2.connect(gain2);
      gain2.connect(audioContext.destination);
      osc2.frequency.value = 1100;
      osc2.type = 'sine';
      gain2.gain.value = 0.3;
      osc2.start();
      setTimeout(() => osc2.stop(), 200);
    }, 300);
    
  } catch (e) {
    console.log('Audio not supported');
  }
}

function cambiarMesa() {
  if (unsubscribe) {
    const database = initFirebase();
    if (database) {
      database.ref('orders').off('value', unsubscribe);
    }
    unsubscribe = null;
  }
  
  mesaActual = null;
  document.getElementById('mesaInput').value = '';
  document.getElementById('resultadoCard').classList.remove('show');
  document.getElementById('inputSection').style.display = 'block';
  document.getElementById('pedidoDetalle').innerHTML = '';
  document.getElementById('estadoTexto').textContent = '';
}

document.getElementById('mesaInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    buscarPedido();
  }
});

const urlParams = new URLSearchParams(window.location.search);
const mesaParam = urlParams.get('mesa');
if (mesaParam) {
  document.getElementById('mesaInput').value = mesaParam;
  setTimeout(buscarPedido, 500);
}

initFirebase();
</script>
</body>
</html>
